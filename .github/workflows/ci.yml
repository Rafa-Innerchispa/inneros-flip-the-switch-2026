name: prepare-and-test
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e ".[switch]"
      - name: Run offline unit tests (hardware E2E runs only on AMD)
        run: |
          python - <<'PY'
          import sys
          import unittest
          from pathlib import Path
          loader = unittest.TestLoader()
          suite = unittest.TestSuite()
          for path in sorted(Path('tests').glob('test_*.py')):
              if path.name == 'test_e2e_full_suite.py':
                  continue
              suite.addTests(loader.discover('tests', pattern=path.name))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
      - name: Reproduce synthetic offline gate
        run: python scripts/offline_gate.py
      - name: Compile Python
        run: python -m compileall -q src
      - name: Exercise blocked and approved synthetic flows
        run: |
          python -m inneros_incident_room.cli --decision deny > /tmp/denied.json
          python -m inneros_incident_room.cli --decision approve > /tmp/approved.json
          python -c 'import json; assert json.load(open("/tmp/denied.json"))["remediation"]["outcome"] == "blocked_by_policy"'
          python -c 'import json; assert json.load(open("/tmp/approved.json"))["remediation"]["outcome"] == "verified_simulation"'
      - name: Pre-publish secret pattern check
        run: python scripts/preflight.py
